name: test

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the release-script tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Run the test suite
        run: ./scripts/test.sh
